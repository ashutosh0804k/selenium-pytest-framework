name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Serial on purpose: parallel calls would hit the ReqRes daily rate limit faster.
      - name: Run API tests
        run: pytest -m api --html=reports/api.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: reports/

  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run UI tests on ${{ matrix.browser }} (headless, parallel)
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          NO_SANDBOX: "true"
        run: pytest -m ui -n auto --html=reports/ui-${{ matrix.browser }}.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.browser }}-report-and-screenshots
          path: |
            reports/
            screenshots/
          if-no-files-found: ignore
